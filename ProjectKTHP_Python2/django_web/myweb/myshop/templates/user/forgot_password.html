{% extends 'base/__base.html' %}
{% block title %}
    Khôi phục Mật khẩu
{% endblock title %}

{% block content %}
    {% load static %}
    <div class="container" style="margin-top: 30px; margin-bottom: 50px;">
        <div class="row">
            <div class="col-sm-8">
                <img class="img-fluid" src="{% static 'images/django.png' %}" alt="" width="100%">
            </div>
            <div class="col-sm-4">
                <h2 class="title text-center" style="margin-bottom: 20px; color: #FE980F;">Khôi Phục Mật Khẩu</h2>
                
                <div id="forgot-alert" class="alert alert-danger" style="display: none;"></div>
                <div id="forgot-success" class="alert alert-success" style="display: none;"></div>

                <form id="forgot-form" action="" method="post" class="needs-validation" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label style="font-weight: 600; color: #333;">{{ field.label }}</label>
                            {{ field }}
                            <div class="invalid-feedback" id="error-{{ field.name }}" style="color: red; display: none; font-size: 13px; margin-top: 5px;"></div>
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn btn-success btn-lg btn-block" style="background-color: #FE980F; border-color: #FE980F; color: white; margin-top: 15px; font-weight: bold;">Đổi Mật Khẩu</button>
                </form>
                
                <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                    <p style="font-size: 14px;">Quay lại <a href="{% url 'login_user' %}" style="color: #FE980F; font-weight: bold;">Đăng nhập</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Ẩn hiện mật khẩu cho tất cả trường password
            $('input[type="password"]').each(function() {
                var $input = $(this);
                $input.wrap('<div class="password-wrapper" style="position: relative;"></div>');
                var $toggle = $('<span class="password-toggle-btn" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; z-index: 10; color: #666;"><i class="fa fa-eye"></i></span>');
                $input.after($toggle);
                
                $toggle.click(function() {
                    var isPassword = $input.attr('type') === 'password';
                    $input.attr('type', isPassword ? 'text' : 'password');
                    $(this).find('i').toggleClass('fa-eye fa-eye-slash');
                });
            });

            // AJAX submit khôi phục mật khẩu
            $("#forgot-form").submit(function(e) {
                e.preventDefault();
                $("#forgot-alert").hide().text("");
                $(".invalid-feedback").hide().text("");
                
                var form = $(this);
                $.ajax({
                    type: "POST",
                    url: form.attr('action'),
                    data: form.serialize(),
                    headers: {
                        "X-Requested-With": "XMLHttpRequest"
                    },
                    success: function(data) {
                        $("#forgot-success").text("Đặt lại mật khẩu thành công! Đang chuyển hướng sang Đăng nhập...").show();
                        setTimeout(function() {
                            window.location.href = data.redirect;
                        }, 1200);
                    },
                    error: function(xhr) {
                        if (xhr.status === 400) {
                            var response = xhr.responseJSON;
                            if (response.errors) {
                                for (var key in response.errors) {
                                    if (key === 'non_field_errors') {
                                        $("#forgot-alert").text(response.errors[key]).show();
                                    } else {
                                        $("#error-" + key).text(response.errors[key]).show();
                                    }
                                }
                            } else if (response.message) {
                                $("#forgot-alert").text(response.message).show();
                            }
                        } else {
                            $("#forgot-alert").text("Thông tin đăng nhập hoặc email không khớp.").show();
                        }
                    }
                });
            });
        }); 
    </script>
{% endblock content %}
